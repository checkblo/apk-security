name: Bootstrap complete CyberTarcza repository

on:
  push:
    branches:
      - codex/cybertarcza-local
    paths:
      - ".github/workflows/bootstrap-repository.yml"

permissions:
  contents: write

jobs:
  unpack:
    name: Restore verified repository contents
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out upload branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/cybertarcza-local

      - name: Verify staged archive
        shell: bash
        run: |
          set -euo pipefail
          echo "d81786b7a6f566711365b95e438e63cca3505f4bd3e2b31328c32b504c8114ca  CyberTarcza-Local-GitHub.zip" | sha256sum --check --strict

      - name: Restore source and release archives
        shell: bash
        run: |
          set -euo pipefail
          restore_dir="$(mktemp -d)"
          unzip -q CyberTarcza-Local-GitHub.zip -d "$restore_dir"
          rsync -a --exclude='.github/workflows/' "$restore_dir/" ./
          mkdir -p release
          cp CyberTarcza-Local-GitHub.zip release/CyberTarcza-Local-GitHub.zip
          cp CyberTarcza-Local-GitHub.zip release/CyberTarcza-Local-1.0.0.zip
          rm CyberTarcza-Local-GitHub.zip

      - name: Publish complete repository tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish complete CyberTarcza security suite"
          git push origin HEAD:codex/cybertarcza-local
