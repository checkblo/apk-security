name: cybertarcza-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://localhost:8443
      COOKIE_SECURE: "1"
      DATA_FILE: /data/cybertarcza.vault
      HIBP_API_KEY_FILE: /run/secrets/hibp_api_key
      DISABLE_EXTERNAL_CHECKS: "0"
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - ./data:/data
    secrets:
      - hibp_api_key
    expose:
      - "3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.5
    networks:
      - private

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    networks:
      - private

networks:
  private:
    driver: bridge

secrets:
  hibp_api_key:
    file: ./.secrets/hibp_api_key.txt
